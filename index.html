<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - StudyHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="halaman-login">
        <section class="kartu-login" aria-labelledby="judul-login">
            <div class="logo" aria-hidden="true">SH</div>
            <h1 id="judul-login">StudyHub</h1>
            <p class="subjudul">Sistem Pengarsipan Materi Perkuliahan</p>

            <div class="garis-pemisah"></div>

            <h2>Selamat Datang</h2>
            <p class="petunjuk">Silakan masuk untuk mengakses materi perkuliahan.</p>

            <form id="form-login">
                <div class="kelompok-input">
                    <label for="nama-pengguna">Nama pengguna</label>
                    <input
                        type="text"
                        id="nama-pengguna"
                        name="nama-pengguna"
                        placeholder="Masukkan nama pengguna"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="kelompok-input">
                    <label for="kata-sandi">Kata sandi</label>
                    <input
                        type="password"
                        id="kata-sandi"
                        name="kata-sandi"
                        placeholder="Masukkan kata sandi"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit">Masuk</button>
                <p id="pesan" class="pesan" role="status" aria-live="polite"></p>
            </form>

            <p class="catatan">Gunakan akun yang telah diberikan oleh pengelola.</p>
        </section>

        <footer>© 2026 StudyHub · Arsip materi perkuliahan dalam satu tempat</footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
